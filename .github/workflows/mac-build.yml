name: Mac build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple silicon (M1 and newer)
            arch: arm64
          - runner: macos-15-intel    # older Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Build the app and .dmg
        run: PYTHON=python ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: APC-Titan-Bridge-mac-${{ matrix.arch }}
          path: dist/APC-Titan-Bridge-mac-${{ matrix.arch }}.dmg
